[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mixconsole"
version = "0.0.1"
description = "Local-first, inspectable automatic DJ transitions for your own files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "pydantic>=2,<3",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "pyloudnorm>=0.1.1",
  "librosa>=0.10.2",
  "platformdirs>=4",
  "pydantic-settings>=2.7",
  "python-stretch>=0.3.1",
]

[project.scripts]
mixconsole = "mixconsole.cli:app"

[project.optional-dependencies]
neural = ["beat-this>=1.1", "torch>=2"]
stems = [
  # demucs 4.1 pins torch<2.3 on Intel macOS; stems need Apple Silicon, Linux or Windows.
  "demucs>=4.1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
ui = []
all = ["mixconsole[neural]"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8",
    "hypothesis>=6",
    "pre-commit>=4",
    "pytest-cov>=6",
    "pytest-timeout>=2",
    "pip-audit>=2.9",
    "hatchling>=1.27",
    "pre-commit-hooks>=5",
    "pytest-xdist>=3.6",
]
docs = ["mkdocs-material>=9", "mkdocs-include-markdown-plugin>=7", "mkdocstrings[python]>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/mixconsole"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "PERF", "NPY", "PIE", "RET", "ISC", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]
"src/mixconsole/cli.py" = ["T201"]
"src/mixconsole/listen/page.py" = ["E501"]

[tool.pyright]
include = ["src", "scripts/gen_schema.py"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=mixconsole --cov-report=term-missing:skip-covered"
timeout = 60
markers = ["slow: optional model or long-running integration tests"]


[tool.coverage.run]
source = ["mixconsole"]

[tool.coverage.report]
fail_under = 91
show_missing = true

# CUDA wheels carry NVIDIA EULAs outside the project's license allowlist.
# The neural extra remains optional; uv selects CPU wheels on Linux/Windows.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# demucs 4.1 pins torch<2.3 / numpy<2 for Intel macOS only; the stems extra is
# marked Apple Silicon/Linux/Windows, so these overrides keep a single resolution fork.
# lameenc (LGPL MP3 encoder) and sphn (no licence metadata) are demucs I/O helpers that
# MixConsole never imports (it uses demucs.apply/pretrained only), so they are not installed.
[tool.uv]
override-dependencies = [
  "torch>=2.1",
  "numpy>=1.26",
  "lameenc; python_version < '0'",
  "sphn; python_version < '0'",
]
