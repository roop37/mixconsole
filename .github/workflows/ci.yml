name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg
      - run: uv sync --locked --dev
      - run: scripts/check.sh
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --dev --group docs
      - run: uv run pytest tests/test_docs.py --no-cov
      - run: uv run python scripts/gen_schema.py --check
      - run: uv run --group docs mkdocs build --strict
      - uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          globs: "README.md docs/**/*.md"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml README.md 'docs/**/*.md'
          fail: true
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --dev --group docs
      - run: uv run python scripts/third_party.py --check
      - name: Audit all locked requirements, including optional CPU neural dependencies
        run: |
          mkdir -p .cache
          uv export --locked --all-extras --all-groups --no-emit-project --no-hashes --no-annotate --no-header -o .cache/audit.txt
          sed -E 's/(torch==[^ +;]+)\+cpu/\1/' .cache/audit.txt > .cache/audit-pypi.txt
          uv run pip-audit --cache-dir .cache/pip-audit --no-deps --disable-pip -r .cache/audit-pypi.txt
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv build
      - name: Install wheel in fresh core-only environment
        run: |
          uv venv /tmp/mixconsole-wheel
          uv pip install --python /tmp/mixconsole-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/mixconsole-wheel/bin/mixconsole --version
          /tmp/mixconsole-wheel/bin/mixconsole doctor
          /tmp/mixconsole-wheel/bin/python -c 'import importlib.util; assert importlib.util.find_spec("torch") is None'
